{% extends "base.html" %}


{% block content %}

        <div class="post-list">


            {% for (category, articles) in categories %}

            <article class="post-list">
                {% for article in articles %}
                    <a href="{{article.url}}"><img src="/{{article.image}}" height="100px"/></a>
                {% endfor %}

                <h2><a href="{{ SITEURL }}/{{ category.url }}">{{ category }} ({{ articles|count }} bird{% if articles|count != 1%}s{%endif%})</a><br><br><br></h2>
            </article>

            {% endfor %}


        </div>



{% endblock content %}
