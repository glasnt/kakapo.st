{% extends "base.html" %}


{% block content %}

        <h1>All birds</h1>

        <div class="post-list">

            {% for article in dates %}

            <article class="post-overview">
                <h2><a href="{{ SITEURL }}/{{ article.url }}">{{ article.title }}</a>
                {% if article.category == "unknown" %}
                    {# <a href="{{BIRD_SUGGESTION_URL}}&title=Suggestion%20for%20{{article.title}}">unknown</a> #}
                    {% else %}<i>{{ article.category }}</i>{% endif %}</h2>
            </article>

            {% endfor %}

        </div>

{% endblock content %}
