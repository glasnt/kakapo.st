{% extends "base.html" %}


{% block content %}

        <h1>All birds</h1>

        <div class="post-list">

            {% for article in dates %}

            <article class="post-overview">
                <li class="bird-list"><a href="{{ SITEURL }}/{{ article.url }}">{{ article.title }}</a>
                {% if article.category == "unknown" %}
                    {% else %}<i>{{ article.category }}</i>{% endif %}</li>
            </article>

            {% endfor %}

        </div>

{% endblock content %}
