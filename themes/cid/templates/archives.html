{% extends "base.html" %}


{% block content %}

        <h1>Archives</h1>

        <div class="post-list">

            {% for article in dates %}

            <article class="post-overview">
                <h2><a href="{{ SITEURL }}/{{ article.url }}">{{ article.title }}</a>
                <i>{% if article.category != DEFAULT_CATEGORY  %}{{ article.category }}{% endif %}</i></h2>
            </article>

            {% endfor %}

        </div>

{% endblock content %}
